<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizForge - Login</title>
    <link rel="stylesheet" href="/static/style.css?v=17">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--clay-shadow);
            border: 1px solid var(--border);
            position: relative;
            z-index: 2;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 2.5rem;
            margin-bottom: .5rem;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: .25rem;
        }

        .login-subtitle {
            color: var(--text-dim);
            font-size: .9rem;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            gap: .5rem;
            margin-bottom: 1.5rem;
            background: var(--bg);
            border-radius: 12px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: .6rem;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: .85rem;
            color: var(--text-dim);
            transition: all .3s ease;
            border: none;
            background: none;
            font-family: inherit;
        }

        .auth-tab.active {
            background: var(--card);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: .4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: .85rem 1rem;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: .95rem;
            color: var(--text);
            font-family: inherit;
            transition: border-color .3s, box-shadow .3s;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, .15);
        }

        .form-group input::placeholder {
            color: var(--text-dim);
            opacity: .5;
        }

        .name-field {
            display: none;
        }

        .name-field.show {
            display: block;
        }

        /* Submit button */
        .auth-submit {
            width: 100%;
            padding: .9rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: transform .2s, box-shadow .2s;
            margin-top: .5rem;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, .4);
        }

        .auth-submit:active {
            transform: translateY(0);
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.2rem 0;
            color: var(--text-dim);
            font-size: .8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* OAuth buttons */
        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            width: 100%;
            padding: .75rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
        }

        .oauth-btn:hover {
            border-color: var(--accent);
            background: var(--card);
            transform: translateY(-1px);
        }

        .oauth-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Error/success messages */
        .auth-message {
            padding: .75rem 1rem;
            border-radius: 10px;
            font-size: .85rem;
            display: none;
            text-align: center;
        }

        .auth-message.error {
            display: block;
            background: rgba(255, 82, 82, .1);
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, .2);
        }

        .auth-message.success {
            display: block;
            background: rgba(85, 239, 196, .1);
            color: #00b894;
            border: 1px solid rgba(85, 239, 196, .2);
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
            font-size: .85rem;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Ambient background dots */
        .login-bg-dots {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>

<body class="light-theme">

    <canvas id="loginBg" class="login-bg-dots"></canvas>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🎨</div>
                <div class="login-title">Welcome to BizForge</div>
                <div class="login-subtitle">AI-powered branding at your fingertips</div>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
                <button class="auth-tab" onclick="switchTab('admin')">Admin</button>
            </div>

            <form class="auth-form" id="authForm" onsubmit="handleSubmit(event)">
                <div class="form-group name-field" id="nameGroup">
                    <label>Full Name</label>
                    <input type="text" id="nameInput" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">Sign In</button>
            </form>

            <div class="auth-divider">or continue with</div>

            <div class="oauth-buttons">
                <!-- Google Sign-In button rendered by GSI -->
                <div id="googleBtnContainer" style="display:flex;justify-content:center;min-height:44px;">
                    <div id="g_id_signin"></div>
                </div>
                <div id="googleNotConfigured" style="display:none;">
                    <button class="oauth-btn" disabled style="opacity:.5;cursor:default;">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Google — needs Client ID in .env
                    </button>
                </div>
                <button class="oauth-btn" onclick="oauthLogin('github')">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path
                            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
                    </svg>
                    Sign in with GitHub
                </button>
            </div>

            <div class="back-link">
                <a href="/">← Back to BizForge</a>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'login';

        function switchTab(tab) {
            currentTab = tab;
            const tabs = document.querySelectorAll('.auth-tab');
            tabs[0].classList.toggle('active', tab === 'login');
            tabs[1].classList.toggle('active', tab === 'register');
            tabs[2].classList.toggle('active', tab === 'admin');

            document.getElementById('nameGroup').classList.toggle('show', tab === 'register');

            if (tab === 'login') {
                document.getElementById('submitBtn').textContent = 'Sign In';
            } else if (tab === 'register') {
                document.getElementById('submitBtn').textContent = 'Create Account';
            } else if (tab === 'admin') {
                document.getElementById('submitBtn').textContent = 'Access Dashboard';
            }
            hideMessage();
        }

        function showMessage(text, type) {
            const el = document.getElementById('authMessage');
            el.textContent = text;
            el.className = 'auth-message ' + type;
        }

        function hideMessage() {
            document.getElementById('authMessage').className = 'auth-message';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            if (currentTab === 'login') btn.textContent = 'Signing in...';
            else if (currentTab === 'register') btn.textContent = 'Creating account...';
            else if (currentTab === 'admin') btn.textContent = 'Verifying...';

            hideMessage();

            const body = {
                email: document.getElementById('emailInput').value,
                password: document.getElementById('passwordInput').value,
            };
            if (currentTab === 'register') {
                body.name = document.getElementById('nameInput').value;
                if (!body.name) {
                    showMessage('Please enter your name', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    return;
                }
            }

            try {
                // Determine endpoint (Admin tab uses regular login endpoint, but verifies role later)
                const url = currentTab === 'register' ? '/api/auth/register' : '/api/auth/login';

                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await resp.json();

                if (resp.ok && data.success) {
                    // Specific check for Admin tab
                    if (currentTab === 'admin') {
                        if (data.user.is_admin) {
                            showMessage('Welcome back, Admin!', 'success');
                            setTimeout(() => window.location.href = '/admin.html', 600);
                        } else {
                            // User is valid but not admin -> logout immediately
                            await fetch('/api/auth/logout', { method: 'POST' });
                            showMessage('Access Denied: You do not have administrator privileges.', 'error');
                            btn.disabled = false;
                            btn.textContent = 'Access Dashboard';
                        }
                    } else {
                        // Standard User Flow
                        showMessage(currentTab === 'login' ? 'Welcome back!' : 'Account created!', 'success');
                        setTimeout(() => window.location.href = '/', 600);
                    }
                } else {
                    showMessage(data.detail || 'Something went wrong', 'error');
                    // Reset button text
                    if (currentTab === 'login') btn.textContent = 'Sign In';
                    else if (currentTab === 'register') btn.textContent = 'Create Account';
                    else if (currentTab === 'admin') btn.textContent = 'Access Dashboard';
                    btn.disabled = false;
                }
            } catch (err) {
                showMessage('Network error. Please try again.', 'error');
                btn.disabled = false;
                if (currentTab === 'login') btn.textContent = 'Sign In';
                else if (currentTab === 'register') btn.textContent = 'Create Account';
                else if (currentTab === 'admin') btn.textContent = 'Access Dashboard';
            }
        }

        function oauthLogin(provider) {
            window.location.href = `/api/auth/${provider}/login`;
        }

        // Google GSI callback — called when user signs in with Google popup
        async function handleGoogleCredential(response) {
            showMessage('Signing in with Google...', 'success');
            try {
                const resp = await fetch('/api/auth/google/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential }),
                });
                const data = await resp.json();
                if (resp.ok && data.success) {
                    showMessage('Welcome, ' + data.user.name + '!', 'success');
                    setTimeout(() => window.location.href = '/', 600);
                } else {
                    showMessage(data.detail || 'Google sign-in failed', 'error');
                }
            } catch (err) {
                showMessage('Network error. Please try again.', 'error');
            }
        }
        // Make it global for GSI
        window.handleGoogleCredential = handleGoogleCredential;

        // Initialize Google Sign-In button
        async function initGoogleSignIn() {
            try {
                const resp = await fetch('/api/auth/config');
                const cfg = await resp.json();
                if (cfg.google_client_id) {
                    document.getElementById('googleBtnContainer').style.display = 'flex';
                    document.getElementById('googleNotConfigured').style.display = 'none';
                    // Wait for GSI library to load
                    const waitForGSI = setInterval(() => {
                        if (window.google && google.accounts) {
                            clearInterval(waitForGSI);
                            google.accounts.id.initialize({
                                client_id: cfg.google_client_id,
                                callback: handleGoogleCredential,
                            });
                            google.accounts.id.renderButton(
                                document.getElementById('g_id_signin'),
                                { theme: 'outline', size: 'large', width: 380, text: 'signin_with', shape: 'rectangular', logo_alignment: 'left' }
                            );
                        }
                    }, 100);
                } else {
                    document.getElementById('googleBtnContainer').style.display = 'none';
                    document.getElementById('googleNotConfigured').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('googleBtnContainer').style.display = 'none';
                document.getElementById('googleNotConfigured').style.display = 'block';
            }
        }
        initGoogleSignIn();

        // Check if already logged in
        fetch('/api/auth/me').then(r => r.json()).then(d => {
            if (d.success && d.user) window.location.href = '/';
        });

        // Ambient dots background
        (function () {
            const canvas = document.getElementById('loginBg');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth * dpr;
                H = canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
            }
            resize();
            window.addEventListener('resize', resize);

            const dots = [];
            for (let i = 0; i < 40; i++) {
                dots.push({
                    x: Math.random() * W, y: Math.random() * H,
                    r: 1 + Math.random() * 2,
                    vx: (Math.random() - .5) * .4,
                    vy: (Math.random() - .5) * .4,
                    color: ['108,92,231', '6,206,201', '253,121,168', '245,158,11'][Math.floor(Math.random() * 4)]
                });
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                for (const d of dots) {
                    d.x += d.vx; d.y += d.vy;
                    if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
                    if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r * dpr, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${d.color},.25)`;
                    ctx.fill();
                }
                // Draw connections
                for (let i = 0; i < dots.length; i++) {
                    for (let j = i + 1; j < dots.length; j++) {
                        const dx = dots[i].x - dots[j].x;
                        const dy = dots[i].y - dots[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150 * dpr) {
                            ctx.beginPath();
                            ctx.moveTo(dots[i].x, dots[i].y);
                            ctx.lineTo(dots[j].x, dots[j].y);
                            ctx.strokeStyle = `rgba(108,92,231,${.06 * (1 - dist / (150 * dpr))})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>

    <script>
        // Apply saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') document.body.classList.replace('light-theme', 'dark-theme');
    </script>
</body>

</html>
